[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-image-visualize"
version = "0.1.0"
description = "Visualization tools for medical images and deep learning workflows."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7",
    "nibabel>=5.0",
    "numpy>=1.23",
]

[tool.setuptools.packages.find]
where = ["src"]
